# extlinux.conf for MSM8953 (Snapdragon 625) lk2nd Dual-Boot Setup
timeout 3
default Debian

label Debian
    menu label Debian GNU/Linux (Mainline MSM8953)
    linux /vmlinuz
    initrd /initramfs.cpio.gz
    fdt /msm8953-xiaomi-vince.dtb
    append console=ttyMSM0,115200 console=tty0 consoleblank=60 root=/dev/loop0 rw

label Android
    menu label Android / LineageOS Host
    linux /android_vmlinuz
    initrd /android_ramdisk.cpio.gz
    fdt /android_dtb
    append console=ttyMSM0,115200 earlycon=msm_serial_dm,0x78af000 androidboot.bootdevice=7824900.sdhci loop.max_part=7
